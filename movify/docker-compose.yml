services:
  db:
    image: postgres:16-alpine
    container_name: ride-app-db
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_secret
      POSTGRES_DB: ride_app
    ports:
      - "5436:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d ride_app"]
      interval: 5s
      timeout: 5s
      retries: 5
