# Cloudflare Tunnel — Ride App API (:4001)
# Copia a ~/.cloudflared/ride-app-config.yml y ajusta tunnel ID + credentials

tunnel: YOUR_TUNNEL_ID
credentials-file: /Users/server/.cloudflared/YOUR_TUNNEL_ID.json
protocol: http2

ingress:
  - hostname: movify-api.vescreenflow.com
    service: http://127.0.0.1:4001
  - hostname: movify.vescreenflow.com
    service: http://127.0.0.1:5174
  - hostname: movify-driver.vescreenflow.com
    service: http://127.0.0.1:5175
  - hostname: movify-admin.vescreenflow.com
    service: http://127.0.0.1:5176
  - service: http_status:404
