name: Ride App CI

on:
  push:
    paths:
      - 'ride-app/**'
      - '.github/workflows/ride-app-ci.yml'
  pull_request:
    paths:
      - 'ride-app/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ride-app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride_secret
          POSTGRES_DB: ride_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride -d ride_app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ride:ride_secret@localhost:5432/ride_app_test
      JWT_SECRET: test-secret
      REQUIRE_PHONE_VERIFY: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ride-app/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup test database
        run: chmod +x scripts/setup-test-db.sh && ./scripts/setup-test-db.sh

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e
