name: VePlayer validation gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build VePlayer debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate gate (parser + poll + dbc; fleet opcional)
        run: npm run validate-gate
        env:
          # Fleet smokes necesitan SenseFlow (vescreendflow). En CI standalone se saltean.
          VALIDATE_SKIP_FLEET: '1'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: veplayer-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
